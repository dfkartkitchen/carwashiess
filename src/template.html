<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{seo_title}}</title>
<meta name="description" content="{{seo_description}}">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/img/favicon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!-- dočasná adresa, po připojení domény změnit (viz README) -->
<link rel="canonical" href="https://carwashiess.netlify.app/">
<script>if(/(invite|recovery|confirmation)_token=/.test(location.hash))location.replace("/admin/"+location.hash);</script>
<link href="/fonts/site.css" rel="stylesheet">
<style>
:root{
  --void:#000;            /* pozadí videa */
  --wet:#EEF5F4;          /* mokrá bílá */
  --mist:#9FB4B6;         /* vedlejší text */
  --beam:#5CD6D2;         /* tyrkys světelných kuželů */
  --foam:#2F6BFF;         /* modrý šampon, akce */
  --steel:#1A2224;        /* linky na tmavé */
  --paper:#EEF3F2;        /* světlé sekce */
  --ink:#071012;          /* text na světlé */
  --display:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--void);color:var(--wet);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
/* vstup: zlatý ticket, po ťuknutí se otevře web */
html.loading,html.loading body{overflow:hidden}
.loader{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(22px,4vh,40px);
  perspective:1600px;transition:visibility 0s 1.7s}
/* pozadí: tmavá šedomodrá, aby ticket nesplýval; po ťuknutí hned mizí a odkryje začátek animace */
.loader::before{content:"";position:absolute;inset:0;z-index:-1;
  background:radial-gradient(ellipse 120% 90% at 50% 42%,#183537 0%,#0E2628 42%,#061719 78%,#031012 100%);
  transition:opacity .8s cubic-bezier(.4,0,.2,1)}
.ticket{all:unset;position:relative;display:block;width:min(92vw,900px);aspect-ratio:2000/750;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transform-style:preserve-3d;will-change:transform;
  animation:ticket-in 1.1s cubic-bezier(.16,1,.3,1) both,ticket-float 5s ease-in-out 1.1s infinite}
.ticket:focus-visible{outline:1px solid #C9A46A;outline-offset:10px}
.ticket .face{position:absolute;inset:0;overflow:hidden;border-radius:4px;-webkit-backface-visibility:hidden;backface-visibility:hidden;
  box-shadow:0 26px 70px rgba(0,0,0,.55),0 0 0 1px rgba(201,164,106,.18)}
.ticket .front img{display:block;width:100%;height:100%;pointer-events:none}
.ticket .back{background:#000;transform:rotateY(180deg)}
.ticket .front::after{content:"";position:absolute;top:-20%;bottom:-20%;left:-40%;width:30%;transform:skewX(-20deg);
  background:linear-gradient(90deg,transparent,rgba(255,236,196,.5),transparent);mix-blend-mode:overlay;
  animation:glint 4s ease-in-out 1s infinite}
@keyframes ticket-in{from{opacity:0;transform:translateY(24px) scale(.94)}to{opacity:1;transform:none}}
@keyframes ticket-float{0%,100%{transform:rotateX(0) rotateY(0) translateY(0)}50%{transform:rotateX(3deg) rotateY(-4deg) translateY(-6px)}}
@keyframes glint{0%{left:-40%}25%,100%{left:120%}}
.tap{display:flex;align-items:center;gap:14px;font:500 13px/1 var(--body);letter-spacing:.32em;text-transform:uppercase;color:#E3C893;
  background:none;border:0;padding:8px;cursor:pointer;animation:tap-in .8s ease .9s both;transition:opacity .3s}
.tap .dot{position:relative;width:10px;height:10px;border-radius:50%;background:#E3C893}
.tap .dot::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:1px solid #E3C893;animation:ping 1.8s ease-out infinite}
.tap .m{display:none}
@media (hover:hover) and (pointer:fine){.tap .t{display:none}.tap .m{display:inline}}
@keyframes tap-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes ping{from{transform:scale(.4);opacity:1}to{transform:scale(1.6);opacity:0}}
.ticket:hover .front::after{animation-duration:1.6s}
/* po ťuknutí: pozadí hned mizí (za ticketem je začátek scroll animace), ticket se plynule otočí
   na černou zadní stranu, přiblíží se a rozplyne (pohyb řídí skript, viz „vstup“ dole) */
.loader.out{visibility:hidden;pointer-events:none}
.loader.out::before{opacity:0}
.loader.out .tap{animation:none;opacity:0}
.loader.out .ticket{animation:none}
.loader.out .ticket .front::after{animation:none;opacity:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--beam);outline-offset:3px}

/* hlavička */
.top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  padding:calc(18px + env(safe-area-inset-top,0px)) clamp(18px,4vw,48px) 18px;pointer-events:none}
.top > *{pointer-events:auto}
.top{transition:background .3s}
.nav{display:flex;gap:clamp(18px,2.4vw,36px);margin:0 clamp(18px,2.6vw,36px) 0 auto}
.nav a{font-size:15px;font-weight:550;color:var(--wet);text-decoration:none;padding:8px 0;position:relative;opacity:.86;transition:opacity .2s,color .2s}
.nav a::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:1px;background:var(--gold,#C9A46A);transform:scaleX(0);transform-origin:left;transition:transform .25s}
.nav a:hover{opacity:1;color:var(--gold-l,#ECD6A8)}
.nav a:hover::after{transform:scaleX(1)}
section[id]{scroll-margin-top:72px}
.top.solid{background:rgba(0,0,0,.78);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:#000}
.brand{display:block;line-height:0;text-decoration:none}
.brand img{display:block;height:clamp(34px,3.6vw,46px);width:auto}
.btn{display:inline-flex;align-items:center;gap:.5em;font:600 15px/1 var(--body);padding:13px 20px;border-radius:999px;
  background:var(--gold,#C9A46A);color:#0B0B0A;text-decoration:none;border:0;cursor:pointer;transition:background .2s}
.btn:hover{background:var(--gold-l,#ECD6A8)}
.btn.ghost{background:transparent;color:var(--wet);box-shadow:inset 0 0 0 1px rgba(238,245,244,.35)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1px var(--wet);background:rgba(238,245,244,.06)}

/* hero se scroll animací */
.hero{position:relative;height:700vh;background:var(--void)}
.stage{position:sticky;top:0;height:100svh;overflow:hidden;contain:strict}
.stage canvas,.stage .poster{position:absolute;inset:0;width:100%;height:100%}
.stage .poster{object-fit:cover}
.stage canvas{opacity:0;transition:opacity .4s}
.stage.ready canvas{opacity:1}
.stage.ready .poster{visibility:hidden}
.shade{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.55) 0,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 62%,rgba(0,0,0,.75) 100%)}

.dim{position:absolute;inset:0;background:rgba(0,0,0,.38);pointer-events:none}
.intro{position:absolute;left:clamp(18px,4vw,48px);right:clamp(18px,4vw,48px);bottom:clamp(40px,9vh,96px);will-change:opacity,transform}
.intro::before{content:"";position:absolute;left:-12vw;bottom:-14vh;width:min(110vw,1100px);height:150%;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse at 22% 62%,rgba(0,0,0,.72) 0,rgba(0,0,0,.45) 38%,rgba(0,0,0,0) 70%)}
.intro h1{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:clamp(32px,5.2vw,84px);line-height:1.06;letter-spacing:-.01em;margin:0;max-width:13ch;
  color:#ECD6A8;background:linear-gradient(175deg,#FBEFD3 0%,#ECD6A8 45%,#C9A46A 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 2px 14px rgba(0,0,0,.7)) drop-shadow(0 0 2px rgba(0,0,0,.5))}
.intro p.sub{margin-top:10px}
.intro p{margin:20px 0 0;max-width:46ch;color:#D3DFE0;text-shadow:0 1px 14px rgba(0,0,0,.85),0 0 2px rgba(0,0,0,.6);font-size:clamp(16px,1.3vw,19px)}
.scrollhint{display:inline-block;margin-top:28px;font-size:14px;color:var(--mist)}
.scrollhint span{display:inline-block;width:1px;height:28px;background:var(--mist);vertical-align:middle;margin-right:12px;animation:drip 1.8s ease-in-out infinite;transform-origin:top}
@keyframes drip{0%{transform:scaleY(0)}50%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}

/* kapitoly */
.chapter{position:absolute;left:clamp(18px,4vw,48px);bottom:clamp(40px,9vh,96px);max-width:420px;opacity:0;transform:translateY(16px);
  transition:opacity .45s,transform .45s;pointer-events:none}
.chapter.on{opacity:1;transform:none}
.chapter .n{font-family:var(--display);font-stretch:125%;font-weight:300;font-size:15px;color:var(--beam);font-variant-numeric:tabular-nums}
.chapter h2{font-family:var(--display);font-stretch:118%;font-weight:750;font-size:clamp(30px,3.6vw,54px);line-height:1;margin:8px 0 0;letter-spacing:-.01em}
.chapter p{margin:0;color:#C9D7D8;font-size:clamp(15px,1.15vw,18px)}

/* průběh mytí vpravo */
.rail{position:absolute;right:clamp(18px,4vw,48px);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:22px;transition:opacity .4s}
.rail li{list-style:none;display:flex;align-items:center;gap:14px;justify-content:flex-end;font-size:13px;color:rgba(238,245,244,.38);transition:color .3s}
.rail li i{display:block;width:40px;height:2px;background:rgba(238,245,244,.18);position:relative;overflow:hidden;border-radius:2px}
.rail li i b{position:absolute;inset:0;background:var(--beam);transform:scaleX(0);transform-origin:left}
.rail li.on{color:var(--wet)}
.rail ol{margin:0;padding:0;display:contents}

/* finále */
.veil{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 70%,rgba(0,0,0,.15),rgba(0,0,0,.7));opacity:0;pointer-events:none}
.finale{position:absolute;left:0;right:0;bottom:clamp(40px,9vh,96px);text-align:center;padding:0 20px;opacity:0;transform:translateY(20px);pointer-events:none}
.finale.on{pointer-events:auto}
.finale h2{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:clamp(36px,6vw,96px);line-height:1.04;margin:0 auto;max-width:14ch;letter-spacing:-.015em}
.finale .actions{margin-top:28px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

/* sekce pod hero */
section.block{padding:clamp(72px,11vw,150px) clamp(18px,4vw,48px)}
.wrap{max-width:1180px;margin:0 auto}
.light{background:var(--paper);color:var(--ink);color-scheme:light}
.light .lede{color:#3C4B4D}
.block h2.title,.svc-head .title,.people__txt .title{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:clamp(34px,4.6vw,68px);line-height:1.06;letter-spacing:-.01em;margin:0;max-width:16ch;text-wrap:balance}
.lede{max-width:56ch;font-size:clamp(17px,1.35vw,20px);color:var(--mist);margin:0}

.services{margin-top:clamp(40px,6vw,80px);display:grid;grid-template-columns:repeat(3,1fr);border-top:1.5px solid var(--ink)}
.svc{padding:28px 28px 34px 0;border-right:1px solid rgba(7,16,18,.15)}
.svc + .svc{padding-left:28px}
.svc:last-child{border-right:0}
.svc h3{font-family:var(--display);font-stretch:112%;font-weight:700;font-size:24px;margin:0 0 10px}
.svc p{margin:0 0 22px;color:#3C4B4D;max-width:34ch}
.svc .price{font-weight:650;font-variant-numeric:tabular-nums}
.svc .time{color:#5A6B6D;font-size:15px}

.contact{display:grid;grid-template-columns:1fr 1fr;gap:clamp(32px,6vw,96px);align-items:start}
.facts{margin:32px 0 0;padding:0;list-style:none;display:grid;gap:14px}
.facts dt{color:var(--mist);font-size:14px}
.facts dd{margin:2px 0 0;font-size:19px}
form{display:grid;gap:16px}
label{display:grid;gap:6px;font-size:14px;color:var(--mist)}
input,select,textarea{font:inherit;color:var(--wet);background:#0A1214;border:1px solid var(--steel);border-radius:10px;padding:13px 14px}
input:focus,select:focus,textarea:focus{border-color:var(--beam);outline:none}
textarea{min-height:120px;resize:vertical}
.hp{position:absolute;left:-9999px}
.form-msg{min-height:1.5em;color:var(--beam);margin:0}
footer{padding:36px clamp(18px,4vw,48px) calc(36px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--steel);color:var(--mist);font-size:14px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* služby: video ve smyčce v pozadí, okna najíždějí při scrollu */
.svc-scroll{position:relative;height:300vh;background:#000}
.svc-stage{position:sticky;top:0;height:100svh;overflow:hidden;contain:strict}
.svc-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.svc-shade{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.84) 0,rgba(0,0,0,.6) 40%,rgba(0,0,0,.38) 62%,rgba(0,0,0,.8) 100%)}
.svc-inner{position:relative;height:100%;max-width:1276px;margin:0 auto;display:flex;flex-direction:column;justify-content:flex-start;gap:clamp(20px,4vh,40px);
  padding:calc(104px + env(safe-area-inset-top,0px)) clamp(18px,4vw,48px) clamp(28px,7vh,72px)}
.svc-head .title{color:var(--wet)}
.svc-head .lede{color:#D3DFE0;text-shadow:0 1px 12px rgba(0,0,0,.8)}
.svc-scroll .services{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:0;border:0}
.svc-scroll .svc,.svc-scroll .svc + .svc{padding:26px 24px 28px;border:1px solid rgba(201,164,106,.26);border-top:2px solid #C9A46A;border-radius:14px;
  background:rgba(6,9,9,.8);color:var(--wet);box-shadow:0 24px 60px rgba(0,0,0,.45);
  opacity:0;transform:translateY(70vh);will-change:transform,opacity}
.svc-scroll .svc p{color:#C3D0D1;margin:0 0 20px}
.svc-scroll .svc .price{color:#ECD6A8}
.svc-scroll .svc .time{color:var(--mist)}
@media (max-width:860px){
  .svc-scroll .services{grid-template-columns:1fr;gap:0}
  .svc-scroll .svc,.svc-scroll .svc + .svc{grid-area:1/1;padding:22px 20px 24px;background:#070A0A}   /* okna se skládají přes sebe: neprůhledná */
  .svc-inner{padding-top:calc(88px + env(safe-area-inset-top,0px))}
}
@media (prefers-reduced-motion:reduce){
  .svc-scroll{height:auto}
  .svc-stage{position:relative;height:auto;min-height:100svh;contain:none}
  .svc-scroll .services{grid-template-columns:1fr;gap:16px}
  .svc-scroll .svc,.svc-scroll .svc + .svc{grid-area:auto;opacity:1;transform:none}
}

/* nabídka: zlatý akcent značky */
:root{--gold:#C9A46A;--gold-l:#ECD6A8;--panel:#0E0F0F;--line-d:#2A2C2C}
.ic{width:14px;height:14px;flex:none}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.eyebrow{display:block;margin:0 0 18px;line-height:1.4}
.title + .lede,.title + p{margin-top:22px}
.lede{line-height:1.6}
.btn--block{display:flex;width:100%;justify-content:space-between;border-radius:12px;padding:18px 22px}
.gold{color:var(--gold-l)}
.finale p.meta{margin:18px auto 0;font-size:13px;color:var(--mist);display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.finale p.meta i{width:3px;height:3px;border-radius:50%;background:var(--gold);display:inline-block}
.ph{position:relative;overflow:hidden;background:linear-gradient(135deg,#2B2D2D,#171818)}
.ph > span,.ph-label{position:absolute;left:14px;bottom:12px;font-size:12px;color:rgba(238,245,244,.5);letter-spacing:.02em}
.svc-head{display:grid;grid-template-columns:1.25fr 1fr;gap:clamp(24px,4vw,72px);align-items:end}
.svc-head .title{max-width:none;font-size:clamp(24px,2.35vw,40px);line-height:1.14;font-stretch:118%}
.svc-head .lede{max-width:52ch;margin:0;font-size:clamp(15px,1.1vw,17px)}
.svc-scroll .services{margin-top:auto}
.svc-img{display:block;width:calc(100% + 16px);height:clamp(96px,19vh,220px);object-fit:cover;border-radius:9px;margin:-10px -8px 18px;background:#1A1C1C}
.svc-ic{width:24px;height:24px;color:var(--gold);display:block;margin-bottom:12px}
.svc-scroll .svc h3{margin:0 0 8px}
.svc-scroll .svc p{margin:0}

.cmp{display:grid;grid-template-columns:1fr 1fr;gap:clamp(16px,2.5vw,32px);align-items:stretch}
.cmp-col{border-radius:20px;padding:clamp(26px,3.6vw,48px)}
.cmp-cw{background:#0B0B0A;color:var(--wet);border-top:2px solid var(--gold)}
.cmp-vap{border:1px solid rgba(7,16,18,.18);color:#3C4B4D}
.cmp-h{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:clamp(19px,1.7vw,25px);letter-spacing:.03em;text-transform:uppercase;line-height:1.2;margin:0 0 22px}
.cmp-cw .cmp-h{color:var(--gold-l)}
.cmp-vap .cmp-h{color:var(--ink)}
.cmp ul{list-style:none;margin:0;padding:0}
.cmp li{display:flex;gap:14px;padding:15px 0;border-top:1px solid;font-size:clamp(15px,1.15vw,17px);line-height:1.5}
.cmp li .ic{width:16px;height:16px;margin-top:4px}
.cmp-cw li{border-color:#2A2C2C}
.cmp-cw li .ic{color:var(--gold)}
.cmp-vap li{border-color:rgba(7,16,18,.12)}
.cmp-vap li .ic{color:#8A9596}
.member{background:#000}
.sec-intro{display:grid;grid-template-columns:1.4fr 1fr;gap:48px;align-items:end;margin-bottom:clamp(40px,6vw,64px)}
.m-grid{display:grid;grid-template-columns:1fr 1.25fr;gap:clamp(32px,5vw,64px);align-items:start}
.m-q{font-size:14px;color:var(--mist)}
.freq{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;max-width:340px}
.freq button{display:inline-flex;align-items:baseline;gap:8px;background:transparent;color:var(--wet);border:1px solid #3A3D3D;border-radius:999px;padding:13px 18px;font:inherit;cursor:pointer;transition:background .2s,border-color .2s,color .2s}
.freq button b{font-size:18px;font-weight:650}
.freq button small{font-size:12px;color:var(--mist)}
.freq button:hover{border-color:var(--gold)}
.freq button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#0B0B0A}
.freq button[aria-pressed="true"] small{color:#2A2416}
.m-chosen{border-top:1px solid var(--line-d);margin-top:40px;padding-top:28px}
.m-chosen h3{font-family:var(--display);font-stretch:112%;font-size:30px;font-weight:700;margin:14px 0 0}
.m-chosen p{margin:12px 0 0;color:var(--mist);max-width:34ch}
.price-card{border:1px solid rgba(201,164,106,.3);border-top:2px solid var(--gold);border-radius:20px;padding:30px;background:var(--panel)}
.price-card__top{display:flex;justify-content:space-between;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--mist)}
.price-card__top span:last-child{color:var(--gold)}
.price{margin-top:28px;display:flex;align-items:baseline;gap:8px}
.price strong{font-family:var(--display);font-stretch:112%;font-size:clamp(48px,5.6vw,66px);font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.price em{font-style:normal;font-size:22px;font-weight:650}
.price small{font-size:13px;color:var(--mist)}
.price-note{font-size:13px;color:var(--mist);margin-top:10px}
.checks{list-style:none;padding:22px 0 0;margin:26px 0 28px;border-top:1px solid var(--line-d);display:grid;gap:13px}
.checks li{display:flex;gap:14px;align-items:center}
.checks .ic{color:var(--gold)}
.m-foot{margin:48px 0 0;font-size:13px;color:var(--mist)}

.why .eyebrow{color:#8A6B3A}
.why-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:clamp(36px,5vw,56px)}
.why-grid > div{border-top:1.5px solid var(--ink);padding-top:22px}
.why-ic{width:24px;height:24px;color:#8A6B3A}

<script>
// úvod se scroll animací: sekvence snímků (AVIF) na plátně
(() => {
  const hero = document.querySelector('.hero');
  const canvas = document.getElementById('seq');
  if (!hero || !canvas) return;
  const VIDEO_END = 0.86;
  const BEHIND = 2;                        // ostré snímky za aktuální pozicí
  let ahead = 6;                           // ostré snímky před aktuální pozicí (roste s rychlostí posunu)
  const PARALLEL = 4;                      // souběžná stahování
  const DECODERS = 2;                      // souběžná rozbalování ostrých snímků
  const DRAFTERS = 2;                      // souběžná rozbalování náhledů

  const stage = document.getElementById('stage');
  const ctx = canvas.getContext('2d', {alpha:false});
  const intro = document.getElementById('intro');
  const dim = document.getElementById('dim');
  const chapters = [...hero.querySelectorAll('.chapter')];
  // podíl délky videa: začátek a konec každé kapitoly (CHAPTER_TIMES v src/render.js)
  const VIDEO_TIMES = chapters.map(el => [+el.dataset.from, +el.dataset.to]);
  let CHAPTER_TIMES = VIDEO_TIMES;   // přepočítané na podíl posunu (viz mapa pohybu níže)
  const railBars = [...document.querySelectorAll('#rail li')].map(li => [li, li.querySelector('b')]);
  const rail = document.getElementById('rail');
  const veil = document.getElementById('veil');
  const finale = document.getElementById('finale');
  const top = document.querySelector('.top');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const mqPortrait = matchMedia('(max-aspect-ratio: 1/1)');
  // prolínání sousedních snímků: na počítači jemně (50 kroků mezi snímky), na dotykových zařízeních
  // úsporněji (10 kroků), kreslí se jen když se obraz opravdu změní
  const SUB = matchMedia('(hover: hover) and (pointer: fine)').matches ? 50 : 10;
  // Safari (a všechny prohlížeče na iOS): dekódování přes <img>.decode() běží mimo hlavní vlákno
  const ua = navigator.userAgent;
  const WEBKIT = /AppleWebKit/.test(ua) && !/Chrome\/|Chromium|Edg\//.test(ua);

  const N = +canvas.dataset.count;
  // mapa pohybu (motion.json ze skriptu tools/hero-frames.sh): u[k] = podíl posunu, kdy je vidět snímek k.
  // Rychlé pasáže videa dostanou víc posunu, klidné méně, takže skoky mezi snímky jsou rovnoměrné.
  let U = null;
  const frameAt = v => {                       // podíl posunu → pozice ve snímcích
    if (!U) return v*(N-1);
    let lo = 0, hi = N-1;
    while (hi - lo > 1){ const m = (lo+hi) >> 1; if (U[m] <= v) lo = m; else hi = m; }
    return lo + (U[hi] > U[lo] ? Math.min(1, (v - U[lo]) / (U[hi] - U[lo])) : 0);
  };
  const scrollAt = t => {                      // podíl videa → podíl posunu
    if (!U) return t;
    const f = t*(N-1), k = Math.min(N-2, Math.floor(f));
    return U[k] + (U[k+1] - U[k]) * (f - k);
  };
  const keys = String(canvas.dataset.keys || '').split(',').map(Number);
  // úsporné připojení: jen každý druhý snímek (polovina dat i dekódování)
  const conn = navigator.connection || {};
  const STEP = (conn.saveData || /(^|-)2g$/.test(conn.effectiveType || '')) ? 2 : 1;
  const snap = i => Math.min(N-1, Math.round(i/STEP)*STEP);

  // dvě vrstvy: ostré snímky (bitmaps) jen v okně kolem aktuální pozice a malé náhledy (drafts) všech snímků.
  // Při rychlém posunu se kreslí náhled místo starého snímku, takže obraz nestojí a nepřeskakuje.
  const blobs = new Array(N), bitmaps = new Array(N), drafts = new Array(N);
  const draftQ = []; let dgen = 0, drafting = 0;
  const fetching = new Map(), decoding = new Set();
  let decodeQueue = [];
  let portrait = mqPortrait.matches;
  let avif = true;                    // prohlížeče bez AVIF dostanou jen klíčové snímky ve WebP
  let srcW = 0, srcH = 0;             // rozměr zdrojových snímků (z prvního snímku)
  let drawW = 0, drawH = 0, drawX = 0, drawY = 0, gen = 0;

  /* ---------- data ---------- */
  const pad = i => String(i+1).padStart(3,'0');
  const urlFor = i => canvas.dataset.src + (avif ? (portrait ? 'mobile/' : 'desktop/') + 'f_' + pad(i) + '.avif' : 'fallback/f_' + pad(i) + '.webp');
  const has = i => avif || keys.includes(i);
  function getBlob(i){
    if (blobs[i]) return Promise.resolve(blobs[i]);
    if (!has(i)) return Promise.reject(0);
    if (fetching.has(i)) return fetching.get(i);
    const pr = fetch(urlFor(i), {priority:'low'}).then(r => { if(!r.ok) throw 0; return r.blob(); })
      .then(b => blobs[i] = b).finally(() => fetching.delete(i));
    fetching.set(i, pr); return pr;
  }
  // pořadí: aktuální snímek, pak hrubé průchody 16, 8, 4, 2, 1 (s ohledem na STEP)
  let preloadStarted = false;
  function preload(start){
    if (preloadStarted) return; preloadStarted = true;
    const seen = new Set([start]), q = [start];
    if (!avif) keys.forEach(k => { if(!seen.has(k)){ seen.add(k); q.push(k); } });
    else for (const st of [16,8,4,2,1]) if (st >= STEP) for (let i=0;i<N;i+=st) if(!seen.has(i)){seen.add(i);q.push(i)}
    const idle = window.requestIdleCallback || (f => setTimeout(f, 30));
    const worker = async () => { while(q.length){ const i=q.shift(); try{ await getBlob(i); queueDraft(i); }catch(e){} await new Promise(r=>idle(r)); } };
    for (let k=0;k<PARALLEL;k++) worker();
  }

  /* ---------- náhledy: každý snímek jednou v malém rozlišení (mobil 360 px, počítač 480 px) ---------- */
  function queueDraft(i){ if (avif && !drafts[i]){ draftQ.push(i); pumpDrafts(); } }
  function pumpDrafts(){
    const idle = window.requestIdleCallback || (f => setTimeout(f, 30));
    while (drafting < DRAFTERS && draftQ.length){
      const i = draftQ.shift(), g = dgen;
      if (drafts[i] || !blobs[i]) continue;
      drafting++;
      smallBitmap(blobs[i], portrait ? 360 : 480).then(bm => {
        if (g !== dgen || drafts[i]) { bm.close(); return; }
        drafts[i] = bm;
        if (!bitmaps[Math.floor(cur)] && Math.abs(i - cur) < 2) { needDraw = true; kick(); }
      }).catch(()=>{}).finally(() => { drafting--; idle(pumpDrafts); });
    }
  }
  async function smallBitmap(blob, w){
    if (WEBKIT){      // Safari neumí zmenšit při rozbalení: dekódovat na pozadí a zmenšit přes plátno
      const url = URL.createObjectURL(blob), img = new Image();
      img.src = url;
      try {
        await img.decode();
        const c = document.createElement('canvas');
        c.width = w; c.height = Math.round(img.naturalHeight * w / img.naturalWidth);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        return await createImageBitmap(c);
      } finally { URL.revokeObjectURL(url); }
    }
    return createImageBitmap(blob, {resizeWidth: w, resizeQuality: 'low'});
  }

  /* ---------- rozbalování jen v okně kolem aktuálního snímku ---------- */
  function requestWindow(c, dir){
    const a = (dir>=0 ? ahead : BEHIND)*STEP, b = (dir>=0 ? BEHIND : ahead)*STEP;
    const want = [];
    if (!avif) want.push(...keys);
    else for (let d=0; d<=Math.max(a,b); d+=STEP){
      if (d<=a && c+d<N) want.push(c+d);
      if (d && d<=b && c-d>=0) want.push(c-d);
    }
    decodeQueue = want.filter(i => !bitmaps[i] && !decoding.has(i));
    // uvolnit jen snímky mimo pevné okno (za pozicí BEHIND+2, před ní 18): proměnlivé „ahead“ jinak
    // při zpomalení zahodí snímky, které se při dalším zrychlení musí rozbalovat znovu
    const lo = c - (dir>=0 ? BEHIND+2 : 18)*STEP, hi = c + (dir>=0 ? 18 : BEHIND+2)*STEP;
    if (avif) for (let i=0;i<N;i++) if (bitmaps[i] && (i < lo || i > hi)){ bitmaps[i].close(); bitmaps[i]=null; }
    pump();
  }
  function pump(){
    while (decoding.size < DECODERS && decodeQueue.length){
      const i = decodeQueue.shift(), g = gen;
      decoding.add(i);
      getBlob(i).then(b => bitmap(b)).then(bmp => {
        if (g !== gen) { bmp.close(); return; }            // mezitím se změnila velikost
        if (!srcW) { srcW = bmp.width; srcH = bmp.height; } // první snímek určí rozměr
        bitmaps[i] = bmp; needDraw = true;
      }).catch(()=>{}).finally(() => { decoding.delete(i); pump(); kick(); });
    }
  }
  // snímek se rozbalí rovnou ve velikosti, ve které se kreslí: menší paměť, kreslení 1:1
  let resizeOK = !WEBKIT;
  async function bitmap(blob){
    if (WEBKIT){
      const url = URL.createObjectURL(blob), img = new Image();
      img.src = url;
      try { await img.decode(); return await createImageBitmap(img); }
      finally { URL.revokeObjectURL(url); }
    }
    if (resizeOK && drawW && srcW){
      try { return await createImageBitmap(blob, {resizeWidth: drawW, resizeHeight: drawH, resizeQuality:'medium'}); }
      catch(e){ resizeOK = false; }
    }
    return createImageBitmap(blob);
  }

  /* ---------- velikost plátna: nikdy větší než zdrojový snímek a jen tam, kde je obraz ---------- */
  function size(){
    portrait = mqPortrait.matches;
    const w = stage.clientWidth, h = stage.clientHeight;
    const iw = srcW || (portrait ? 1080 : 1920), ih = srcH || (portrait ? 788 : 1080);
    const css = portrait ? Math.min(w/iw, h/ih) : Math.max(w/iw, h/ih);       // měřítko v CSS px
    const dpr = Math.min(devicePixelRatio || 1, 2, 1/css);                      // víc pixelů než má snímek nemá smysl
    const W = Math.round(w*dpr), H = Math.round(h*dpr);
    const dw = Math.round(iw*css*dpr), dh = Math.round(ih*css*dpr);
    const dx = Math.round((W-dw)/2), dy = Math.round((H-dh)/2 - (portrait ? H*0.06 : 0));
    // na výšku zabírá obraz jen část obrazovky: plátno má velikost obrazu, ne celé obrazovky
    const cx = Math.max(0, dx), cy = Math.max(0, dy);
    const cw = Math.min(W, dx+dw) - cx, ch = Math.min(H, dy+dh) - cy;
    if (cw===canvas.width && ch===canvas.height && dw===drawW && dx-cx===drawX && dy-cy===drawY) return;
    canvas.width = cw; canvas.height = ch;
    Object.assign(canvas.style, {left: cx/dpr+'px', top: cy/dpr+'px', width: cw/dpr+'px', height: ch/dpr+'px'});
    drawW = dw; drawH = dh;
    drawX = dx - cx; drawY = dy - cy;
    ctx.imageSmoothingQuality = 'medium';
    // staré bitmapy mají jinou velikost: zahodit a rozbalit znovu
    gen++; bitmaps.forEach((b,i)=>{ if(b){ b.close(); bitmaps[i]=null; } });
    needDraw = true; lastKey = -1; lastIdx = -1;
  }

  /* ---------- kreslení ---------- */
  const covers = () => drawX<=0 && drawY<=0 && drawX+drawW>=canvas.width && drawY+drawH>=canvas.height;
  function put(bmp, alpha){
    ctx.globalAlpha = alpha;
    if (bmp.width===drawW && bmp.height===drawH) ctx.drawImage(bmp, drawX, drawY);   // bez škálování
    else ctx.drawImage(bmp, drawX, drawY, drawW, drawH);
  }
  function nearest(i){ for(let d=0;d<N;d++){ if(bitmaps[i-d])return bitmaps[i-d]; if(bitmaps[i+d])return bitmaps[i+d]; } return null }

  /* ---------- texty a průběh: zapisuje se jen při změně ---------- */
  const last = new Map();
  const set = (key, fn, val) => { if (last.get(key) !== val){ last.set(key, val); fn(val); } };
  function ui(p){
    const v = Math.min(1, p / VIDEO_END);
    want = frameAt(v);
    const io = Math.max(0, 1 - v/0.035);
    if (intro) set('io', x => { intro.style.opacity = x; intro.style.visibility = x ? '' : 'hidden'; if (dim) dim.style.opacity = x; }, +io.toFixed(3));
    if (intro && io) set('it', x => intro.style.transform = `translateY(${x}px)`, Math.round(-v*600));
    chapters.forEach((el,k)=>{ const [a,b]=CHAPTER_TIMES[k]; set('c'+k, x => el.classList.toggle('on', x), v>=a && v<=b) });
    railBars.forEach(([li,bar],k)=>{ if (!CHAPTER_TIMES[k]) return; const [a,b]=CHAPTER_TIMES[k];
      set('r'+k, x => bar.style.transform = `scaleX(${x})`, +Math.min(1, Math.max(0,(v-a)/(b-a))).toFixed(2));
      set('l'+k, x => li.classList.toggle('on', x), v>=a && v<=b+0.03); });
    if (rail) set('rail', x => rail.style.opacity = x, (v<0.02 || p>VIDEO_END) ? 0 : 1);
    const f = +Math.min(1, Math.max(0,(p-VIDEO_END)/(1-VIDEO_END)*1.6)).toFixed(3);
    set('f', x => { veil.style.opacity = x; finale.style.opacity = x; finale.style.transform = `translateY(${(1-x)*20}px)`; }, f);
    set('fo', x => finale.classList.toggle('on', x), f>0.5);
  }

  /* ---------- smyčka běží jen když je co dělat ---------- */
  let want=0, cur=0, lastKey=-1, lastIdx=-1, needDraw=true, raf=0, active=true, lastP=-1;
  let lastT = 0, lastScroll = 0, idleTimer = 0;
  const IDLE = 100;                     // ms bez posunu = zastaveno
  const kick = () => { if (!raf && active) raf = requestAnimationFrame(tick); };
  function tick(now){
    raf = 0;
    const r = hero.getBoundingClientRect();
    const p = Math.min(1, Math.max(0, -r.top / (r.height - innerHeight)));
    if (p !== lastP){ lastP = p; ui(p); }

    // po zastavení dojet na celý snímek: bez prolnutí dvou snímků, obraz je ostrý
    const idle = performance.now() - lastScroll > IDLE;
    const target = idle ? Math.round(want/STEP)*STEP : want;
    const d = target - cur;
    // dojezd podle času, ne podle počtu snímků obrazovky (stejně rychlý na 60 i 120 Hz)
    const dt = lastT ? Math.min(64, now - lastT) : 16.7; lastT = now;
    const k = 1 - Math.pow(idle ? 0.6 : 0.8, dt/16.7);          // po zastavení rychlejší dojezd
    cur = Math.abs(d) < (idle ? 0.05 : 0.01) ? target : cur + d*k;
    // čím rychlejší posun, tím víc ostrých snímků dopředu (6 až 16)
    ahead = Math.min(16, 6 + Math.ceil(Math.abs(d)));
    const i = Math.min(N-1, Math.floor(cur/STEP)*STEP), t = (STEP===1 && avif) ? cur - i : 0;
    const idx = idle ? target : snap(cur);   // po zastavení rozbalit přednostně cílový snímek
    if (idx !== lastIdx){ requestWindow(idx, d>=0 ? 1 : -1); lastIdx = idx; }

    const key = Math.round(cur*SUB);
    if (needDraw || key !== lastKey){
      const a = bitmaps[i] || drafts[i] || nearest(i), b = t>0.02 ? (bitmaps[i+1] || drafts[i+1]) : null;
      if (a){
        if (!covers()){ ctx.globalAlpha=1; ctx.fillStyle='#000'; ctx.fillRect(0,0,canvas.width,canvas.height); }
        put(a,1); if (b) put(b,t);
        if (!stage.classList.contains('ready')) stage.classList.add('ready');
        lastKey = key; needDraw = false;
      }
    }
    if (cur !== target || needDraw) kick(); else lastT = 0;     // dojede-li animace, smyčka se zastaví
  }

  // mimo úvod: smyčka stojí a rozbalené snímky se uvolní (zabalené zůstanou pro návrat)
  new IntersectionObserver(([e]) => {
    active = e.isIntersecting;
    if (active){ needDraw = true; lastIdx = -1; kick(); }
    else { bitmaps.forEach((b,i)=>{ if(b){ b.close(); bitmaps[i]=null; } }); lastIdx = -1; }
  }, {rootMargin:'50% 0px'}).observe(hero);
  document.addEventListener('visibilitychange', () => { if (!document.hidden){ needDraw = true; kick(); } });

  addEventListener('scroll', () => {
    lastScroll = performance.now(); kick();
    // po zastavení ještě jeden průchod: dojet na celý snímek a rozbalit ho ostrý
    clearTimeout(idleTimer); idleTimer = setTimeout(() => { lastIdx = -1; kick(); }, IDLE + 20);
  }, {passive:true});
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { size(); kick(); }, 150); });
  mqPortrait.addEventListener?.('change', () => {
    blobs.fill(undefined); srcW = srcH = 0; preloadStarted = false;
    dgen++; draftQ.length = 0; drafts.forEach((b,i) => { if (b){ b.close(); drafts[i] = null; } });
    size(); preload(snap(cur)); kick();
  });

  function start(){
    if (!window.createImageBitmap) return;     // velmi staré prohlížeče: zůstane úvodní snímek
    if (reduced){                     // bez animace: rovnou poslední stav
      ui(1); size();
      const k = avif ? N-1 : keys[keys.length-1];
      getBlob(k).then(b=>createImageBitmap(b)).then(b=>{ ctx.fillStyle='#000'; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.drawImage(b,drawX,drawY,drawW,drawH); b.close(); stage.classList.add('ready'); }).catch(()=>{});
      return;
    }
    size();
    const sync = () => { const r = hero.getBoundingClientRect(); const p = Math.min(1, Math.max(0, -r.top/(r.height-innerHeight))); last.clear(); ui(p); };
    sync(); cur = want;
    fetch(canvas.dataset.src + 'motion.json').then(r => r.ok ? r.json() : null).then(m => {
      if (!m || !Array.isArray(m.u) || m.u.length !== N) return;
      U = m.u; CHAPTER_TIMES = VIDEO_TIMES.map(([a,b]) => [scrollAt(a), scrollAt(b)]);
      sync(); cur = want; needDraw = true; kick();
    }).catch(()=>{});
    const first = avif ? snap(cur) : keys[0];
    // první snímek hned, ostatní až když prohlížeč nemá co dělat
    getBlob(first).catch(()=>{}).then(()=>{ kick(); preload(first); });
    // po zjištění skutečného rozměru snímků přepočítat plátno
    const fix = setInterval(() => { if (srcW){ clearInterval(fix); size(); kick(); } }, 100);
  }
  // podpora AVIF: malý testovací obrázek
  const probe = new Image();
  probe.onload = () => { avif = probe.width > 0; start(); };
  probe.onerror = () => { avif = false; start(); };
  probe.src = 'data:image/avif;base64,AAAAIGZ0eXBhdmlmAAAAAGF2aWZtaWYxbWlhZk1BMUIAAADrbWV0YQAAAAAAAAAhaGRscgAAAAAAAAAAcGljdAAAAAAAAAAAAAAAAAAAAAAOcGl0bQAAAAAAAQAAAB5pbG9jAAAAAEQAAAEAAQAAAAEAAAETAAAAGAAAAChpaW5mAAAAAAABAAAAGmluZmUCAAAAAAEAAGF2MDFDb2xvcgAAAABqaXBycAAAAEtpcGNvAAAAFGlzcGUAAAAAAAAAAgAAAAIAAAAQcGl4aQAAAAADCAgIAAAADGF2MUOBAAwAAAAAE2NvbHJuY2x4AAEADQAGgAAAABdpcG1hAAAAAAAAAAEAAQQBAoMEAAAAIG1kYXQSAAoFGAA2BCAyDRgACiiihAAAsBNK214=';
})();

// služby: video hraje jen když je sekce vidět, okna najíždějí postupně
(() => {
  const sec = document.querySelector('.svc-scroll'); if (!sec) return;
  const v = sec.querySelector('.svc-bg');
  const cards = [...sec.querySelectorAll('.svc')];
  const lede = sec.querySelector('.svc-head .lede');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const mobile = matchMedia('(max-width: 860px)');
  const START = 0.06, GAP = 0.24, RUN = 0.22;     // poslední okno dojede v 0,76, pak se pokračuje dál
  let raf = 0, inView = false; const last = [];

  // video: zdroj až když se sekce blíží, přehrává jen ve výřezu
  if (v) new IntersectionObserver(([e]) => {
    if (e.isIntersecting && !v.getAttribute('src')){
      const d = v.dataset;
      const src = mobile.matches ? (d.mobile || d.desktop) : (d.desktop || d.mobile);   // mobil: výřez na výšku
      if (src) v.src = src;
    }
  }, {rootMargin:'100% 0px'}).observe(sec);
  new IntersectionObserver(([e]) => {
    inView = e.isIntersecting;
    if (v){ if (inView && !reduced) v.play().catch(()=>{}); else v.pause(); }
    if (inView) kick();
  }).observe(sec);
  document.addEventListener('visibilitychange', () => { if (!v) return; if (document.hidden) v.pause(); else if (inView && !reduced) v.play().catch(()=>{}); });

  if (reduced) return;
  const ease = t => 1 - Math.pow(1 - t, 3);
  function tick(){
    raf = 0;
    const r = sec.getBoundingClientRect();
    const p = Math.min(1, Math.max(0, -r.top / (r.height - innerHeight)));
    const m = mobile.matches;
    const e0 = ease(Math.min(1, Math.max(0, (p - START) / RUN)));
    const lo = m ? +(1 - e0).toFixed(3) : 1;
    if (lede && last.lede !== lo){ last.lede = lo; lede.style.opacity = lo; }
    cards.forEach((c, k) => {
      const e = ease(Math.min(1, Math.max(0, (p - START - k*GAP) / RUN)));
      const base = m ? k*14 : 0;                     // na mobilu se okna skládají přes sebe
      const val = (+e.toFixed(3)) + ':' + base;
      if (last[k] === val) return; last[k] = val;
      c.style.opacity = Math.min(1, e*1.4).toFixed(3);
      c.style.transform = `translate3d(0, calc(${base}px + ${((1-e)*70).toFixed(2)}vh), 0)`;
    });
  }
  const kick = () => { if (!raf && inView) raf = requestAnimationFrame(tick); };
  addEventListener('scroll', kick, {passive:true});
  addEventListener('resize', () => { last.length = 0; last.lede = undefined; kick(); });
  tick();
})();

// vstup: web se odkryje až po ťuknutí na ticket
(() => {
  const L = document.getElementById('loader'); if (!L) return;
  const T = document.getElementById('ticket');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let done = false;
  const enter = () => { if (done) return; done = true;
    scrollTo(0,0);
    if (!reduced && T.animate){
      // začít přesně z polohy, ve které se ticket právě vznáší (bez poskočení), pak jedna plynulá křivka:
      // otočení na zadní stranu a přiblížení zároveň, v druhé polovině se ticket rozplyne
      const from = getComputedStyle(T).transform;
      T.style.animation = 'none';
      const opts = {duration: 1600, fill: 'forwards'};
      T.animate([
        {transform: from === 'none' ? 'none' : from},
        {transform: 'rotateY(-90deg) scale(1.7)', offset: .5},
        {transform: 'rotateY(-180deg) scale(2.6)'}
      ], {...opts, easing: 'cubic-bezier(.55,.05,.25,1)'});
      // průhlednost jen na stranách karty: opacity na celé kartě by zplošťovala 3D a ukázala zrcadlovou přední stranu
      T.querySelectorAll('.face').forEach(f => f.animate([{opacity: 1}, {opacity: 1, offset: .42}, {opacity: 0, offset: .85}, {opacity: 0}], {...opts, easing: 'linear'}));
    }
    L.classList.add('out'); document.documentElement.classList.remove('loading');
    setTimeout(() => L.remove(), 1800); };
  L.addEventListener('click', e => { if (e.target.closest('.ticket,.tap')) enter(); });
  addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape') { if (!done && document.activeElement === document.body) { e.preventDefault(); enter(); } } });
})();

// hlavička: tmavý podklad mimo úvod (na podstránkách vždy)
(() => {
  const top = document.querySelector('.top'), hero = document.querySelector('.hero');
  if (!hero){ top.classList.add('solid'); return; }
  // pruh 90 px pod horním okrajem: dokud do něj zasahuje úvod, je hlavička průhledná
  let io;
  const watch = () => {
    if (io) io.disconnect();
    io = new IntersectionObserver(([e]) => top.classList.toggle('solid', !e.isIntersecting), {rootMargin: `0px 0px ${90 - innerHeight}px 0px`});
    io.observe(hero);
  };
  watch();
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(watch, 200); });
})();

// členství: výběr frekvence propisuje cenu i poptávku (ceny jsou v administraci, blok Měsíční členství)
(() => {
  const buttons = [...document.querySelectorAll('.freq button')];
  const $ = id => document.getElementById(id);
  const txt = (id, s) => { const el = $(id); if (el) el.textContent = s; };
  const plan = document.querySelector('.freq');
  const name = plan ? plan.dataset.plan || '' : '', per = plan ? plan.dataset.per || '' : '';
  function select(n){
    const b = buttons.find(x => x.dataset.n == n); if (!b) return;
    const d = b.dataset, NB = '\u00A0', label = (name ? name + ' · ' : '') + n + '×' + NB + 'měsíčně';
    buttons.forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
    txt('price', d.price); txt('price-note', d.note);
    txt('rhythm-title', n + '×' + NB + 'měsíčně'); txt('rhythm-desc', d.desc);
    txt('sum-title', label); txt('sum-price', d.price + NB + 'Kč ' + per);
    const f = $('plan-field'); if (f) f.value = (label + ' – ' + d.price + ' Kč ' + per).replace(/\u00A0/g, ' ');
  }
  buttons.forEach(b => b.addEventListener('click', () => select(b.dataset.n)));

  const form = document.querySelector('form[name="poptavka"]'); if (!form) return;
  const msg = form.querySelector('.form-msg');
  form.addEventListener('reset', () => setTimeout(() => { const on = document.querySelector('.freq [aria-pressed="true"]'); if (on) select(on.dataset.n); }));
  // kontrola formuláře před odesláním (jméno, telefon), pak odeslání do Netlify Forms
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const nm = form.jmeno, tel = form.telefon;
    let err = '';
    if (!nm.value.trim()) { err = 'Vyplňte prosím jméno.'; nm.focus(); }
    else if (tel.value.replace(/\D/g,'').length < 9) { err = 'Zadejte prosím telefon, ať se vám můžeme ozvat.'; tel.focus(); }
    msg.classList.toggle('err', !!err);
    if (err) { msg.textContent = err; return; }
    const btn = form.querySelector('button[type=submit]'); btn.disabled = true;
    try{
      const r = await fetch('/', {method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(new FormData(form)).toString()});
      if(!r.ok) throw 0; form.reset(); msg.textContent = form.dataset.ok;
    }catch(_){ msg.classList.add('err'); msg.textContent = form.dataset.err; }
    btn.disabled = false;
  });
})();
</script>
